<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orb1" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#1a4fc0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#060a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="15%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#2060e0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#060a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#3a7fff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060a12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060a12" stop-opacity="0"/>
      <stop offset="25%" stop-color="#1a4fc0"/>
      <stop offset="55%" stop-color="#5090ff"/>
      <stop offset="100%" stop-color="#060a12" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#c8deff"/>
      <stop offset="100%" stop-color="#4a90ff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.07)"/>
    </pattern>
    <!-- Neon glow filter for text -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feGaussianBlur stdDeviation="16" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonLine">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="320" fill="#060a12"/>
  <!-- Grille -->
  <rect width="1200" height="320" fill="url(#grid)"/>
  <!-- Orbes -->
  <rect width="1200" height="320" fill="url(#orb1)"/>
  <rect width="1200" height="320" fill="url(#orb2)"/>
  <rect width="1200" height="320" fill="url(#orb3)"/>

  <!-- Ligne accent haut -->
  <rect width="1200" height="2" y="0" fill="url(#accentLine)" filter="url(#neonLine)"/>
  <!-- Ligne accent bas -->
  <rect width="1200" height="1.5" y="318" fill="url(#accentLine)" opacity="0.6"/>

  <!-- Logo box -->
  <rect x="72" y="36" width="48" height="48" rx="12" fill="#0d1e38" stroke="rgba(80,144,255,0.45)" stroke-width="1.2"/>
  <rect x="72" y="36" width="48" height="48" rx="12" fill="url(#orb1)" opacity="0.8"/>
  <path d="M96 48 L110 58 H106 V68 H86 V58 H82 Z" stroke="#7ab0ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  <path d="M82 71 Q88 69 96 71 T110 71" stroke="#5090ff" stroke-width="1.8" fill="none" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M82 75 Q88 73 96 75 T110 75" stroke="#3a70d0" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Brand name -->
  <text x="138" y="67" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#softGlow)">FloodRoute</text>
  <text x="138" y="88" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#1e3a5e" letter-spacing="1">Simulation &amp; Gestion des urgences</text>

  <!-- Séparateur décoratif gauche -->
  <rect x="72" y="104" width="48" height="1.5" rx="1" fill="#1a4fc0" filter="url(#neonLine)"/>
  <rect x="124" y="104" width="22" height="1.5" rx="1" fill="#5090ff" opacity="0.35"/>

  <!-- Tagline héroïque avec effet néon -->
  <text x="72" y="162" font-family="'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="800" fill="#e8f2ff" letter-spacing="-2" filter="url(#softGlow)">Anticiper.</text>
  <text x="72" y="222" font-family="'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="800" fill="#a8caff" letter-spacing="-2">Alerter.</text>
  <!-- "Protéger." en bleu néon -->
  <text x="72" y="282" font-family="'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="800" fill="#4a90ff" letter-spacing="-2" filter="url(#neonGlow)" opacity="0.5">Protéger.</text>
  <text x="72" y="282" font-family="'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="800" fill="#5090ff" letter-spacing="-2" filter="url(softGlow)">Protéger.</text>

  <!-- Colonne droite -->
  <text x="640" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#1a4fc0" letter-spacing="3.5" font-weight="700">PLATEFORME DE SIMULATION</text>
  <text x="640" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-size="14.5" fill="#6a90b8" font-weight="400">Application JavaFX de simulation d'inondation</text>
  <text x="640" y="120" font-family="'Segoe UI', system-ui, sans-serif" font-size="14.5" fill="#6a90b8">avec agents et graphes.</text>

  <!-- Ligne séparateur droite -->
  <rect x="640" y="138" width="510" height="0.8" fill="rgba(255,255,255,0.06)"/>

  <!-- Pills / tags avec néon -->
  <rect x="640" y="152" width="138" height="26" rx="13" fill="rgba(26,79,192,0.15)" stroke="#1a4fc0" stroke-width="0.8" filter="url(#neonLine)"/>
  <text x="709" y="169" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#5090ff" text-anchor="middle" font-weight="500">Simulation temps réel</text>

  <rect x="789" y="152" width="82" height="26" rx="13" fill="rgba(26,79,192,0.15)" stroke="#1a4fc0" stroke-width="0.8"/>
  <text x="830" y="169" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#5090ff" text-anchor="middle" font-weight="500">Alertes</text>

  <rect x="882" y="152" width="80" height="26" rx="13" fill="rgba(26,79,192,0.15)" stroke="#1a4fc0" stroke-width="0.8"/>
  <text x="922" y="169" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#5090ff" text-anchor="middle" font-weight="500">Secours</text>

  <!-- Ligne séparateur droite 2 -->
  <rect x="640" y="196" width="510" height="0.8" fill="rgba(255,255,255,0.04)"/>

  <!-- Infos équipe -->
  <text x="640" y="220" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#1a3050">Projet ING1 GI4  ·  CY Tech  ·  2025–2026</text>
  <text x="640" y="240" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#1a3050">Agents et Graphes  ·  Tutrice : D. Zaouche  ·  Jury : S. Hawari</text>

  <!-- Ligne verticale gauche déco -->
  <rect x="72" y="36" width="1.5" height="270" fill="rgba(26,79,192,0.12)"/>
</svg>
