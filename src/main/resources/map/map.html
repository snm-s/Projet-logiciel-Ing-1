<html>
<head>
    <meta charset="UTF-8">
    <base href="." />
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
    <style>
        html,body,#map{height:100%;margin:0;padding:0;background:#090e1a;}
        .leaflet-container{background:#090e1a!important;}
        .leaflet-popup-content-wrapper{
            background:#131b2e;
            color:#f1f5f9;
            border:1px solid #1e293b;
            border-radius:8px;
            box-shadow:0 8px 32px rgba(0,0,0,0.7);
        }
        .leaflet-popup-tip{background:#131b2e;}
        .leaflet-popup-content{margin:10px 14px;}
        .zone-label{
            font-size:13px;font-weight:900;color:white;
            text-shadow:0 0 6px rgba(0,0,0,0.9),1px 1px 3px rgba(0,0,0,0.8);
            letter-spacing:1px;
        }
        .agent-icon{font-size:18px;filter:drop-shadow(0 0 4px rgba(34,197,94,0.8));}
        .danger-icon{font-size:20px;filter:drop-shadow(0 0 6px rgba(239,68,68,0.9));}

        /* Contrôles zoom custom */
        .leaflet-control-zoom a {
            background:#131b2e !important;
            color:#f1f5f9 !important;
            border-color:#1e293b !important;
        }
        .leaflet-control-zoom a:hover {
            background:#1e293b !important;
            color:#3b82f6 !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // ──────────────────────────────────────────────
        // INITIALISATION CARTE
        // ──────────────────────────────────────────────
        var map = L.map('map', {
            zoomControl: true,
            attributionControl: false
        }).setView([45.7640, 4.8357], 13);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd'
        }).addTo(map);

        // ──────────────────────────────────────────────
        // ÉTAT GLOBAL
        // ──────────────────────────────────────────────
        window.zoneLayers  = {};   // id → L.circle
        window.routeLayers = [];   // L.polyline[]
        window.labelLayers = {};   // id → L.marker (label)
        var currentPopup = null;

        // ──────────────────────────────────────────────
        // COULEURS SELON NIVEAU D'EAU
        // ──────────────────────────────────────────────
        window.getWaterColor = function(flooded, evacuated, niveauEau) {
            if (!flooded) return { fill: '#22c55e', opacity: 0.35 };
            if (evacuated) return { fill: '#ef4444', opacity: 0.55 };
            if (niveauEau > 2)   return { fill: '#1e3a8a', opacity: 0.70 };
            if (niveauEau > 1.5) return { fill: '#1d4ed8', opacity: 0.65 };
            if (niveauEau > 1)   return { fill: '#3b82f6', opacity: 0.60 };
            if (niveauEau > 0.5) return { fill: '#60a5fa', opacity: 0.55 };
            return { fill: '#bfdbfe', opacity: 0.45 };
        };

        // ──────────────────────────────────────────────
        // MISE À JOUR D'UNE ZONE (appelée depuis Java)
        // ──────────────────────────────────────────────
        window.updateZone = function(id, flooded, evacuated, niveauEau) {
            var layer = window.zoneLayers[id];
            if (!layer) return;
            var c = window.getWaterColor(flooded, evacuated, niveauEau);
            layer.setStyle({
                color: c.fill,
                fillColor: c.fill,
                fillOpacity: c.opacity,
                weight: flooded ? 2.5 : 1.5
            });
        };

        // ──────────────────────────────────────────────
        // AJOUT D'UNE ZONE (appelée depuis Java)
        // ──────────────────────────────────────────────
        window.addZone = function(id, lat, lng, name, pop, alt, desc, isFlooded) {
            var color = isFlooded ? '#3b82f6' : '#22c55e';
            var circle = L.circle([lat, lng], {
                radius: 500,
                color: color,
                fillColor: color,
                fillOpacity: 0.35,
                weight: 1.5,
                className: 'zone-circle'
            }).addTo(map);

            window.zoneLayers[id] = circle;

            // Label centré sur la zone
            var labelIcon = L.divIcon({
                className: '',
                html: '<div class="zone-label">' + name.substring(0, 12) + '</div>',
                iconAnchor: [0, 0]
            });
            var labelMarker = L.marker([lat, lng], { icon: labelIcon, interactive: false });
            labelMarker.addTo(map);
            window.labelLayers[id] = labelMarker;

            // ── CLIC SUR LA ZONE → popup infos ──
            circle.on('click', function(e) {
                L.DomEvent.stopPropagation(e);

                // Fermer ancien popup
                if (currentPopup) { map.closePopup(currentPopup); }

                // Construire popup
                var statusColor = isFlooded ? '#ef4444' : '#22c55e';
                var statusText  = isFlooded ? '⚠ Inondée' : '✓ Sûre';
                var altColor    = alt < 1.0 ? '#ef4444' : alt < 2.0 ? '#f59e0b' : '#22c55e';

                var html =
                    "<div style='font-family:monospace;min-width:200px;'>" +
                    "<div style='font-size:14px;font-weight:900;color:#f1f5f9;" +
                         "margin-bottom:8px;border-bottom:1px solid #1e293b;padding-bottom:6px;'>" +
                         name + "</div>" +

                    "<div style='display:flex;justify-content:space-between;margin-bottom:4px;'>" +
                    "<span style='color:#94a3b8;font-size:11px;'>Statut</span>" +
                    "<span style='color:" + statusColor + ";font-size:11px;font-weight:bold;'>" + statusText + "</span></div>" +

                    "<div style='display:flex;justify-content:space-between;margin-bottom:4px;'>" +
                    "<span style='color:#94a3b8;font-size:11px;'>Population</span>" +
                    "<span style='color:#f1f5f9;font-size:11px;font-weight:bold;'>" + pop + " hab.</span></div>" +

                    "<div style='display:flex;justify-content:space-between;margin-bottom:4px;'>" +
                    "<span style='color:#94a3b8;font-size:11px;'>Altitude</span>" +
                    "<span style='color:" + altColor + ";font-size:11px;font-weight:bold;'>" +
                         alt.toFixed(1) + " m</span></div>" +

                    "<div style='margin-top:6px;padding:6px;background:#0d1117;border-radius:4px;'>" +
                    "<span style='color:#94a3b8;font-size:10px;'>" + desc + "</span></div>" +

                    "<div style='display:flex;justify-content:space-between;margin-top:6px;'>" +
                    "<span style='color:#94a3b8;font-size:10px;'>Lat: " + lat.toFixed(4) + "</span>" +
                    "<span style='color:#94a3b8;font-size:10px;'>Lng: " + lng.toFixed(4) + "</span></div>" +
                    "</div>";

                currentPopup = L.popup({
                    maxWidth: 280,
                    className: 'zone-popup'
                })
                .setLatLng([lat, lng])
                .setContent(html)
                .openOn(map);

                // Notifier Java du clic via window.javaCallback si défini
                if (window.onZoneClicked) {
                    window.onZoneClicked(id);
                }
            });

            // Survol : mise en avant
            circle.on('mouseover', function() {
                if (!isFlooded) {
                    circle.setStyle({ fillOpacity: 0.55, weight: 2.5 });
                }
                circle.bringToFront();
            });
            circle.on('mouseout', function() {
                var c2 = window.getWaterColor(isFlooded, false, 0);
                circle.setStyle({ fillOpacity: c2.opacity, weight: isFlooded ? 2.5 : 1.5 });
            });
        };

        // ──────────────────────────────────────────────
        // CHARGEMENT GROUPÉ (appelé depuis Java)
        // ──────────────────────────────────────────────
        window.loadAllZones = function(zonesJson) {
            var zones = JSON.parse(zonesJson);
            zones.forEach(function(z) {
                addZone(z.id, z.lat, z.lng, z.name, z.pop, z.alt, z.desc, z.flooded);
            });
            // Dessiner les routes par défaut après chargement
            window.drawDefaultRoutes(zones);
        };

        // ──────────────────────────────────────────────
        // ROUTES INTER-ZONES
        // ──────────────────────────────────────────────

        /** Supprime toutes les routes dessinées. */
        window.clearRoutes = function() {
            window.routeLayers.forEach(function(l) { map.removeLayer(l); });
            window.routeLayers = [];
        };

        /**
         * Dessine une route entre deux points avec une couleur et un style donnés.
         * style : 'safe' | 'risk' | 'flooded'
         */
        window.drawRoute = function(from, to, color, style) {
            var dashArray = style === 'flooded' ? '6,4' : (style === 'risk' ? '10,5' : null);
            var weight    = style === 'flooded' ? 3 : (style === 'risk' ? 2.5 : 2);
            var opacity   = style === 'flooded' ? 0.9 : 0.75;

            var polyline = L.polyline([from, to], {
                color: color,
                weight: weight,
                opacity: opacity,
                dashArray: dashArray
            }).addTo(map);

            window.routeLayers.push(polyline);
        };

        /**
         * Dessine les routes par défaut entre les zones selon leur proximité
         * et altitude (simulant un réseau routier entre quartiers).
         * Connecte chaque zone à ses 2-3 voisines les plus proches.
         */
        window.drawDefaultRoutes = function(zones) {
            if (!zones || zones.length === 0) return;
            window.clearRoutes();

            // Construire les paires de connexions (réseau prédéfini)
            // Basé sur la géographie de Lyon pour des routes réalistes
            var connections = [
                [1, 2], [1, 3], [1, 4], [1, 5],   // Presqu'île ↔ voisins
                [2, 6], [2, 10],                   // Confluence ↔ Gerland, Port
                [3, 7], [3, 9],                    // Tête d'Or ↔ Part-Dieu, Croix-Rousse
                [4, 9], [4, 1],                    // Fourvière ↔ Croix-Rousse, Centre
                [5, 7], [5, 10],                   // Guillotière ↔ Part-Dieu, Port
                [6, 10], [6, 2],                   // Gerland ↔ Port, Confluence
                [7, 8], [7, 5],                    // Part-Dieu ↔ Villeurbanne, Guillotière
                [8, 3], [8, 7],                    // Villeurbanne ↔ Tête d'Or, Part-Dieu
                [9, 4], [9, 3],                    // Croix-Rousse ↔ Fourvière, Tête d'Or
                [10, 5], [10, 2]                   // Port ↔ Guillotière, Confluence
            ];

            // Créer une map id → zone pour accès rapide
            var zoneMap = {};
            zones.forEach(function(z) { zoneMap[z.id] = z; });

            connections.forEach(function(conn) {
                var from = zoneMap[conn[0]];
                var to   = zoneMap[conn[1]];
                if (!from || !to) return;

                // Couleur selon état des zones
                var color, style;
                if (from.flooded && to.flooded) {
                    color = '#ef4444'; style = 'flooded';   // rouge = inondée
                } else if (from.flooded || to.flooded) {
                    color = '#f59e0b'; style = 'risk';       // orange = risque
                } else if (from.alt < 1.0 || to.alt < 1.0) {
                    color = '#f59e0b'; style = 'risk';       // orange = zone basse = risque
                } else {
                    color = '#22c55e'; style = 'safe';       // vert = sûre
                }

                window.drawRoute(
                    [from.lat, from.lng],
                    [to.lat, to.lng],
                    color, style
                );
            });
        };

        /**
         * Met à jour les couleurs des routes selon l'état actuel des zones.
         * À appeler après chaque pas de simulation.
         */
        window.refreshRouteColors = function(zonesJson) {
            var zones = JSON.parse(zonesJson);
            window.drawDefaultRoutes(zones);
        };

        // ──────────────────────────────────────────────
        // HIGHLIGHT D'UNE ZONE (appelé depuis MapController)
        // ──────────────────────────────────────────────
        window.highlightZone = function(id) {
            // Remettre toutes les zones à leur style normal
            Object.keys(window.zoneLayers).forEach(function(zid) {
                var layer = window.zoneLayers[zid];
                if (layer) {
                    layer.setStyle({ weight: 1.5 });
                }
            });
            // Mettre en surbrillance la zone sélectionnée
            var target = window.zoneLayers[id];
            if (target) {
                target.setStyle({ weight: 4, opacity: 1.0 });
                target.bringToFront();
            }
        };

        // ──────────────────────────────────────────────
        // POPUP DEPUIS JAVA (appelé depuis MapController)
        // ──────────────────────────────────────────────
        window.showZonePopup = function(id, htmlContent) {
            var layer = window.zoneLayers[id];
            if (!layer) return;
            var center = layer.getLatLng();
            if (currentPopup) { map.closePopup(currentPopup); }
            currentPopup = L.popup({ maxWidth: 300 })
                .setLatLng(center)
                .setContent(htmlContent)
                .openOn(map);
        };

        // ──────────────────────────────────────────────
        // CORRECTION TAILLE AU CHARGEMENT
        // ──────────────────────────────────────────────
        window.fixMapSize = function() {
            map.invalidateSize();
        };

        window.onload = function() {
            setTimeout(function() { map.invalidateSize(); }, 500);
            setTimeout(function() { map.invalidateSize(); }, 1500);
        };
    </script>
</body>
</html>
